{% block head %} 
{{super()}}
<style>
.btn-1{
    color:#9e4f4b!important;
}
table {
    width: 100%;
  }
  
  table tbody tr td {
    padding: 3px;
    vertical-align: bottom;
    text-align: center;
  }
  
  .input-container {
    padding: 10px;
  }
  
  .settings-container {
    position: absolute;
    bottom: 0;
    left: 5%;
    right: 5%;
    padding: 5px;
    background-color: rgba(255, 255, 255, 0.8);
  }
  
  .canvas-container {
    margin: 10px;
    text-align: center;
  }

  label {
    font-family: Lato;
    font-size: 0.75em;
    color: #000;
    display: block;
  }

  .slider {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.75);
    outline: none;
    -webkit-transition: .2s;
    transition: opacity .2s;
  }
  
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #000;
    cursor: pointer;
    border: 4px solid #fff;
  }
  
  .slider::-moz-range-thumb {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #000;
    cursor: pointer;
  }

  .contact-wrapper .row.align-items-center{
    background-color: #9e4b47;
  }
  .contact-wrapper .row.align-items-center .canvas-container{
    background-color: #FFF;
  }

  .nice-select{
      margin-bottom: 10px;
  }
</style>

{% endblock %}

    <Script>
        //分子结构展示
        var input = document.getElementById('input');
        var debugCheckbox = document.getElementById('debug');
        var bondThicknessInput = document.getElementById('bondThickness')
        var textSizeInput = document.getElementById('textSize');

        debug: false,

        }
        
        var smilesDrawer = new SmilesDrawer.Drawer(options);

        var log = document.getElementById('log');
        
        function draw() {
        let t = performance.now();
        
        SmilesDrawer.parse(input.value, function (tree) {
            smilesDrawer.draw(tree, 'output-canvas', 'light', false);
            let td = performance.now() - t;
            log.innerHTML = '&nbsp;';
            log.style.visibility = 'hidden';
        
            new Noty({
            text: 'Drawing took ' + td.toFixed(3) + 'ms with a total overlap score of ' + smilesDrawer.getTotalOverlapScore().toFixed(3) + '.',
            killer: true,
            timeout: 2000,
            animation: {
                open: null,
                close: null
            }
            }).show();
        }, function (err) {
            log.innerHTML = err;
            log.style.visibility = 'visible';
            console.log(err);
        });      
        }
        
        function updateOptions() {
        smilesDrawer = new SmilesDrawer.Drawer(options);
        draw();
        }

            draw();
        });
