[mapping]
;输入配置路径前缀
base_input_path = /input
;输出配置路径前缀
base_output_path = /output
;扩展配置路径前缀
base_ext_path = /ext
;公共配置路径前缀
base_common_path = /common

[input]

pretrained_model = supervised_contextpred.pth

[output]
output = result.txt


[ext]
;算子执行状态
task_state_file = task_state.json
;全局日志
stdout_file = std_out.log
;错误日志
stderr_file = std_err.log


[param]
dataset = tox21
graph_model = "gin"
taskaware_attention = True
edge_pred = True
atom_pred = True
weight = 0.1
support = 5


[resouce]
;静态文件
resource_file = demo.txt